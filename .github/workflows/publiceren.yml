# Zet de map site/ online via GitHub Pages.
# Staat bewust op handmatig: er gaat niets live tot iemand deze workflow zelf start
# (tabblad Actions > Site publiceren > Run workflow) en GitHub Pages aan staat in de instellingen.
name: Site publiceren
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publiceren:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Rekenmodel en cijfers controleren
        run: node test.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
